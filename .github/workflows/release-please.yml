name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Optional: you can provide a custom token if you want to trigger
          # other workflows from the release PR. For now, we use the default.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout release branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).head_branch }}

      - name: Set up Python
        if: ${{ steps.release.outputs.pr }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: ${{ steps.release.outputs.pr }}
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Update uv.lock for release
        if: ${{ steps.release.outputs.pr }}
        run: |
          uv lock
          if [ -n "$(git status --porcelain uv.lock)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: update uv.lock for release"
            git push origin HEAD:${{ fromJSON(steps.release.outputs.pr).head_branch }}
          fi
