name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          # Optional: you can provide a custom token if you want to trigger
          # other workflows from the release PR. For now, we use the default.
          token: ${{ secrets.GITHUB_TOKEN }}
